name: Pruebas

on:
  push:
  pull_request:

# Mínimo privilegio: este workflow solo necesita leer el código.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -v

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Dependencias con vulnerabilidades conocidas (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Análisis estático de seguridad del código (bandit)
        run: bandit -r vigia main.py
