name: Panel diario (GitHub Pages)

# Cada mañana consulta las CVE de los últimos 30 días, calcula la prioridad,
# cruza con el inventario, publica el panel en GitHub Pages y avisa a Discord.
#
# Configuración (una sola vez):
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions:
#     NVD_API_KEY          (opcional, recomendado)
#     DISCORD_WEBHOOK_URL  (opcional, para las alertas)
on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC = 7:17 a. m. en República Dominicana
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás que muestra el panel"
        default: "30"
      enviar_alerta:
        description: "Enviar alerta a Discord"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Generar panel
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DIAS: ${{ inputs.dias || '30' }}
          ALERTA: ${{ github.event_name == 'schedule' || inputs.enviar_alerta }}
          URL_PANEL: ${{ steps.pages.outputs.base_url }}
        run: |
          ARGS=(--ultimos-dias "$DIAS" --fuentes todas --salida output --dashboard site --url-panel "$URL_PANEL/")
          if [ "$ALERTA" = "true" ] && [ -n "$DISCORD_WEBHOOK_URL" ]; then
            ARGS+=(--alerta-discord)
          fi
          python main.py "${ARGS[@]}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
