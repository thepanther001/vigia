name: CodeQL

# Análisis de seguridad de GitHub sobre el código Python y el JavaScript del panel.
# Los hallazgos aparecen en la pestaña Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [python, javascript]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.lenguaje }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
